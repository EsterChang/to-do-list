<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>
    <button id="add-project-button" commandfor="add-project-dialog" command="show-modal">
        Add Project
    </button>
    <dialog id="add-project-dialog">
        <form class="add-project-form">
            <label for="project-title-input">Project title:</label>
            <input id="project-title-input" type="text" required>

            <button>Create Project</button>
        </form>
        <button class="close-button">Close</button>
    </dialog>

    <template id="add-todo-template">
        <form class="add-todo-form">
            <label for="title">New Todo: </label>
            <input class="todo-title-input" placeholder="description" type="text" required>

            <input class="todo-dueDate-input" type="date">

            <button>Submit</button>
        </form>
    </template>
</body>
</html>
